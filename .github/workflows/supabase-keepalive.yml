name: Supabase keep-alive

# O plano gratuito do Supabase pausa o projeto após ~1 semana sem uso.
# Este job faz uma consulta leve duas vezes por semana para evitar a pausa.
# Requer os secrets do repositório SUPABASE_URL e SUPABASE_ANON_KEY.
on:
  schedule:
    - cron: "0 12 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta leve na API do Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/categories?select=id&limit=1"
